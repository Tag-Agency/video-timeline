name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: engine
      - run: npm run typecheck
        working-directory: engine
      - name: Il bundle committato è aggiornato
        working-directory: engine
        run: |
          npm run build
          git diff --exit-code -- ../plugins/silo/server/engine.mjs || (echo "Esegui npm run build e committa engine.mjs" && exit 1)
      - run: npm test
        working-directory: engine
      - name: Validazione plugin e marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate plugins/silo

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci && npm run build:mac
        working-directory: engine
      - name: Pubblica l'eseguibile per Mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" engine/dist/silo-engine-darwin-arm64 --title "$GITHUB_REF_NAME" --generate-notes
